name: Render social graphics

on:
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "photos/**"
      - "render.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every spec, ignoring the manifest"
        type: boolean
        default: false

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fonts
        run: python render.py --fonts

      - name: Render
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python render.py --all --force
          else
            python render.py --all
          fi

      - name: Commit PNGs
        run: |
          git config user.name "golf-sessions-render"
          git config user.email "render@golf-sessions.com"
          git add out/
          if git diff --cached --quiet; then
            echo "no new graphics"
            exit 0
          fi
          git commit -m "render: $(git diff --cached --name-only | grep -c '\.png$') graphic(s) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
